name: CI/CD

# Replaces the Jenkins pipeline for the Render deployment. Jenkins used to build
# and deploy on the server itself; Render's free tier has no room for it, so the
# build moves here and Render pulls the image from GHCR.
#
# Required repository secrets:
#   RENDER_DEPLOY_HOOK_PROD     — Render deploy hook URL for the production service
#   RENDER_DEPLOY_HOOK_STAGING  — same, for the staging service (optional)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ── 1. Lint — runs on PRs and pushes ──────────────────────────────────────
  lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax (all files)
        run: |
          echo "Running PHP syntax check on all .php files…"
          ERROR=0
          while IFS= read -r -d '' file; do
            php -l "$file" || ERROR=1
          done < <(find my_eshop -name "*.php" -print0)
          if [ $ERROR -ne 0 ]; then
            echo "❌ Syntax errors found — fix them before merging."
            exit 1
          fi
          echo "✅ All PHP files passed syntax check."

  # ── 2. Build & push to GHCR — pushes only ─────────────────────────────────
  build:
    name: Build & Push Image
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      # Required for the GHA build cache below: the default docker driver
      # cannot export cache ("Cache export is not supported for the docker
      # driver"), only the buildx container driver can.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Tell Render to pull the new image ──────────────────────────────────
  deploy:
    name: Trigger Render Deploy
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staging (develop)
        if: github.ref == 'refs/heads/develop'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_STAGING not set — skipping staging deploy."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK" && echo "Staging deploy triggered."

      - name: Deploy production (main)
        if: github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_PROD is not set." >&2
            exit 1
          fi
          curl -fsSL -X POST "$HOOK" && echo "Production deploy triggered."
